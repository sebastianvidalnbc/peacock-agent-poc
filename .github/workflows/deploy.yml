# Automatic GitHub Pages deployment.
# Every push to main builds and deploys the prototype; workflow_dispatch allows
# manual reruns. The repository root is the application root — package.json,
# package-lock.json, and the Vite dist/ output all live at the repo root, so no
# working-directory override is needed.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        # Default base "/peacock-agent-poc/" is correct because the repo is
        # named peacock-agent-poc. Otherwise set: GH_PAGES_BASE: /<repo-name>/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
